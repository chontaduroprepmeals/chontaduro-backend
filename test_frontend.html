<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chontaduro Menu Generator</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: auto; padding: 20px; }
  .hidden { display: none; }
  .step { margin-bottom: 20px; }
  button { margin-top: 10px; }
</style>
</head>
<body>

<h1>🍽️ Chontaduro Menu Generator</h1>

<div id="question"></div>
<div id="fields"></div>

<button id="backBtn" class="hidden">Back</button>
<button id="nextBtn">Next</button>

<div id="menuDisplay" class="hidden">
  <h2>Your Menu</h2>
  <ul id="menuList"></ul>
  <p>Total price: $<span id="totalPrice"></span></p>

  <h3>Add Extra Protein</h3>
  <input type="number" id="proteinAmount" placeholder="grams" min="1">
  <label><input type="checkbox" id="distributeAll" checked> Distribute in all meals</label>
  <select id="selectMeal" class="hidden"></select>
  <button id="addProteinBtn">Add Protein</button>
</div>

<script>
let sessionId = Date.now().toString();
let stepHistory = [];
let currentStep = "pick_plan";

async function renderStep(step) {
    let res = await fetch("/next-step", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, step: step, answer: {} })
    });
    let data = await res.json();
    if(data.menu) {
        displayMenu(data);
        return;
    }
    const qDiv = document.getElementById("question");
    const fDiv = document.getElementById("fields");
    qDiv.innerHTML = `<h3>${data.question}</h3>`;
    fDiv.innerHTML = "";
    data.fields.forEach(field => {
        if(field.type === "select") {
            let select = document.createElement("select");
            select.id = field.name;
            field.options.forEach(opt => select.options.add(new Option(opt,opt)));
            fDiv.appendChild(select);
        } else if(field.type === "multiselect") {
            let container = document.createElement("div");
            field.options.forEach(opt => {
                let label = document.createElement("label");
                let checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = opt;
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(opt));
                container.appendChild(label);
                container.appendChild(document.createElement("br"));
            });
            fDiv.appendChild(container);
        } else {
            let input = document.createElement("input");
            input.type = "number";
            input.id = field.name;
            fDiv.appendChild(input);
        }
    });

    document.getElementById("backBtn").classList.toggle("hidden", stepHistory.length === 0);
    currentStep = step;
}

async function submitStep() {
    const fDiv = document.getElementById("fields");
    let answer = {};
    Array.from(fDiv.querySelectorAll("select,input")).forEach(el => {
        if(el.type==="checkbox") return;
        answer[el.id] = el.value;
    });
    // Multiselect
    fDiv.querySelectorAll("div").forEach(div=>{
        let selected = [];
        div.querySelectorAll("input[type=checkbox]").forEach(cb=>{
            if(cb.checked) selected.push(cb.value);
        });
        if(selected.length>0) answer[div.querySelector("input[type=checkbox]").parentNode.textContent.trim()] = selected;
    });

    stepHistory.push(currentStep);

    let res = await fetch("/next-step", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, step: currentStep, answer: answer })
    });
    let data = await res.json();
    if(data.menu) {
        displayMenu(data);
    } else {
        renderStep(data.fields ? currentStep : currentStep);
        renderStep(stepHistory[stepHistory.length-1]);
        renderStep(data.question ? currentStep : currentStep);
        renderStep(stepHistory[stepHistory.length-1]);
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
        renderStep(stepHistory.pop());
    }
}

document.getElementById("nextBtn").addEventListener("click", async ()=>{
    const fDiv = document.getElementById("fields");
    let answer = {};
    fDiv.querySelectorAll("input, select").forEach(el=>{
        if(el.type==="checkbox") return;
        answer[el.id] = el.value || (el.checked ? el.value : "");
    });
    fDiv.querySelectorAll("div").forEach(div=>{
        let selected = [];
        div.querySelectorAll("input[type=checkbox]").forEach(cb=>{
            if(cb.checked) selected.push(cb.value);
        });
        if(selected.length>0) answer[div.querySelector("input[type=checkbox]").parentNode.textContent.trim()] = selected;
    });

    let res = await fetch("/next-step", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, step: currentStep, answer: answer })
    });
    let data = await res.json();
    if(data.menu) displayMenu(data);
    else renderStep(data.fields ? currentStep : currentStep);
    stepHistory.push(currentStep);
});

document.getElementById("backBtn").addEventListener("click", ()=>{
    if(stepHistory.length>0){
        let prev = stepHistory.pop();
        renderStep(prev);
    }
});

function displayMenu(data){
    document.getElementById("menuDisplay").classList.remove("hidden");
    let ul = document.getElementById("menuList");
    ul.innerHTML="";
    data.menu.forEach(m=>{
        let li = document.createElement("li");
        li.textContent = `${m.name} - ${m.type} - ${m.calories} cal - $${m.price}`;
        ul.appendChild(li);
    });
    document.getElementById("totalPrice").textContent = data.price;

    // Mostrar opción de seleccionar solo una comida si plan >1
    if(data.menu.length>1){
        const selectMeal = document.getElementById("selectMeal");
        selectMeal.innerHTML="";
        data.menu.forEach(m=>{
            let opt = document.createElement("option");
            opt.value = m.name;
            opt.textContent = m.name;
            selectMeal.appendChild(opt);
        });
        selectMeal.classList.remove("hidden");
    }
}

document.getElementById("addProteinBtn").addEventListener("click", async ()=>{
    const grams = parseFloat(document.getElementById("proteinAmount").value);
    const distribute = document.getElementById("distributeAll").checked;
    const mealName = document.getElementById("selectMeal").value;

    const res = await fetch("/add-protein", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({session_id:sessionId, extra_protein_g:grams, distribute_all:distribute, meal_name:mealName})
    });
    const data = await res.json();
    displayMenu(data);
});

renderStep(currentStep);
</script>
</body>
</html>
