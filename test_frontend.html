<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ Chontaduro Menu Generator</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff8f3;
      color: #333;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #ff7b00;
      margin-bottom: 1rem;
    }
    form {
      display: inline-block;
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      text-align: left;
      max-width: 400px;
      width: 100%;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }
    button {
      background-color: #ff7b00;
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #e96a00;
    }
    #menu {
      margin-top: 2rem;
      text-align: left;
      display: inline-block;
    }
    .meal {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <h1>🍽️ Chontaduro Menu Generator</h1>

  <div id="app">
    <p>Loading...</p>
  </div>

  <script>
    const BASE_URL = "https://chontaduro-backend.onrender.com";
    let sessionId = Math.random().toString(36).substring(2);
    let step = "pick_plan";
    let history = [];

    async function fetchStep(answer = {}) {
      try {
        const response = await fetch(`${BASE_URL}/next-step`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, step, answer }),
        });

        if (!response.ok) throw new Error("Request failed");
        const data = await response.json();

        if (data.menu) {
          showMenu(data);
        } else {
          history.push({ step, answer });
          showForm(data.question, data.fields);
        }
      } catch (err) {
        document.getElementById("app").innerHTML = "<p>Error loading form.</p>";
      }
    }

    function showForm(question, fields) {
      let formHtml = `<form id="stepForm"><h2>${question}</h2>`;
      fields.forEach(f => {
        formHtml += `<label>${f.name}</label>`;
        if (f.type === "select") {
          formHtml += `<select name="${f.name}">
            ${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}
          </select>`;
        } else if (f.type === "multiselect") {
          formHtml += `<select name="${f.name}" multiple size="5">
            ${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}
          </select>`;
        } else {
          formHtml += `<input type="${f.type}" name="${f.name}" required />`;
        }
      });
      formHtml += `<button type="submit">Next</button>`;
      if (history.length > 0) formHtml += `<button type="button" id="backBtn">Back</button>`;
      formHtml += `</form>`;
      document.getElementById("app").innerHTML = formHtml;

      document.getElementById("stepForm").onsubmit = e => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const answer = {};
        for (const [key, value] of formData.entries()) {
          if (answer[key]) {
            if (!Array.isArray(answer[key])) answer[key] = [answer[key]];
            answer[key].push(value);
          } else {
            answer[key] = value;
          }
        }
        step = fields[0].name.toLowerCase().includes("plan") ? "pick_plan" :
               fields[0].name.toLowerCase().includes("day") ? "duration" :
               step === "pick_plan" ? "duration" : step;
        fetchStep(answer);
      };

      const backBtn = document.getElementById("backBtn");
      if (backBtn) {
        backBtn.onclick = () => {
          if (history.length > 0) {
            const prev = history.pop();
            step = prev.step;
            fetchStep(prev.answer);
          }
        };
      }
    }

    function showMenu(data) {
      let html = `<h2>Your menu is ready!</h2>
      <div id="menu">`;
      data.menu.forEach(m => {
        html += `<div class="meal">
          <strong>${m.name}</strong> (${m.type})<br>
          ${m.calories} kcal - $${m.price.toFixed(2)}
        </div>`;
      });
      html += `</div><p><strong>Total Price:</strong> $${data.price.toFixed(2)}</p>`;
      document.getElementById("app").innerHTML = html;
    }

    fetchStep();
  </script>
</body>
</html>
