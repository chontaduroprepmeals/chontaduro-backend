<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chontaduro Menu Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* --- Responsive typography & base --- */
    :root {
      /* Base font-size responsive: between 15px and 18px depending on viewport */
      font-size: clamp(15px, 1.0vw + 1.0px, 18px);
    }

    /* Tamaño global de fuentes */
    html, body {
      height: auto; /* Permitir tamaño dinámico */
      margin: 0;
      padding: 0;
      background: #f7f3f0;
      font-family: Inter, sans-serif;
      overflow-y: scroll; /* Mantén solo el scroll vertical */
      overflow-x: hidden; /* Evitar desplazamiento horizontal */
      -webkit-overflow-scrolling: touch; /* Suaviza el desplazamiento en iOS */
      transform: scale(1); /* Zoom al 100% */
      transform-origin: top left;
      box-sizing: border-box;
      font-size: 22px;
      line-height: 1.8;
    }
    *, *::before, *::after { box-sizing: inherit; }

    /* App shell that always fills the viewport and centers content */
    /* Elementos principales */
    .app-shell {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px; /* Ajusta espacio interno del contenedor */
      transition: padding .15s ease;
      overflow-y: scroll; /* Habilitar el desplazamiento interno */
      -webkit-overflow-scrolling: touch; /* Suaviza scroll en iOS */
      display: flex;
      flex-direction: column; /* Asegura que el contenido pueda expandirse */
      /* Ajuste proporcional de tamaño de fuente dentro de la aplicación */
      font-size: 1.6em;
    }

    /* Inputs y selects (formularios) */
    input, select {
      font-size: 1.3em;
      padding: 10px;
    }

    /* Botones */
    button {
      font-size: 1.4em;
      padding: 10px 20px;
    }

    a {
      font-size: 1.3em; /* Links más visibles */
      text-decoration: underline;
    }

    /* Card that grows responsively and keeps readable line-length */
    .app-card {
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      padding: 28px;
      box-sizing: border-box;
      font-size: 1rem;
      line-height: 1.45;
    }

    /* Headings */
    .app-card h1 { font-size: clamp(20px, 3.6vw, 32px); margin: 0 0 12px 0; }
    .app-card h2 { font-size: clamp(16px, 2.2vw, 20px); margin: 0 0 8px 0; }

    /* Loader */
    .loader {
      border-top-color: #ff7b00;
      animation: spin 1s linear infinite;
      border: 4px solid #e5e7eb;
      border-top-width: 4px;
      border-radius: 9999px;
      width: 48px;
      height: 48px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Modal styles (covers full viewport and is mobile-friendly) */
    #zipModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px; /* so modal never touches edges on small screens */
    }
    #zipModal {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      text-align: left;
    }
    #zipModal h2 { margin: 0 0 10px 0; }
    #zipModal input[type="text"] {
      width: 100%;
      padding: 10px; font-size: 1rem;
      margin: 8px 0 12px 0;
      box-sizing: border-box;
    }
    #zipModal .actions {
      display: flex; gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }
    #zipModal .hint {
      font-size: 0.9rem;
      color: #666;
      margin-top: 8px;
    }

    /* Banner and messages */
    #zipBanner {
      display: none;
      background: #fff4e5;
      border-left: 4px solid #ffb74d;
      padding: 10px 14px;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    #zipMessage {
      margin-top: 8px;
      color: #b00020;
    }

    /* Make inputs and buttons more touch-friendly */
    button, input, select, textarea { -webkit-tap-highlight-color: rgba(0,0,0,0); }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      :root { font-size: clamp(15px, 2.8vw, 18px); } /* slightly larger base on very small screens */
      .app-shell { padding: 12px; align-items: flex-start; }
      .app-card { padding: 18px; border-radius: 10px; }
      #zipModal { padding: 14px; }
      #zipModal .actions { flex-direction: column-reverse; align-items: stretch; }
      #zipModal .actions button { width: 100%; }
    }

    @media (min-width: 1200px) {
      .app-shell { padding: 32px; }
      .app-card { padding: 40px; }
      :root { font-size: clamp(16px, 1.0vw + 1.5px, 19px); }
    }

    /* --- Iframe / embed specific rules --- */
    html.in-iframe body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow-y: auto;
    }

    html.in-iframe .app-shell {
      min-height: 100vh;
      padding: 0; margin: 0;
      width: 100%;
    }

    html.in-iframe .app-card {
      max-width: 100%;
      width: 100%;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
    html.in-iframe #zipModal { max-height: 88vh; overflow: auto; }
  </style>
</head>
<body>
  <!-- El resto del código queda intacto aquí -->
</body>
</html>
