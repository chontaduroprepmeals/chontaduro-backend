<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chontaduro Menu Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Responsive typography & base settings */
    :root {
      font-size: clamp(15px, 1.0vw + 1.0px, 18px); /* Between 15px and 18px depending on viewport */
    }

    /* Global styles */
    html, body {
      height: auto; /* Adapt height dynamically */
      margin: 0;
      padding: 0;
      background: #f7f3f0;
      font-family: Inter, sans-serif;
      overflow-y: auto; /* Enable vertical scroll */
      overflow-x: hidden; /* Avoid horizontal scroll */
      box-sizing: border-box;
      font-size: 22px; /* Enlarged font size */
      line-height: 1.8; /* Comfortable spacing */
      -webkit-overflow-scrolling: touch; /* Smooth scroll for iOS */
    }

    *, *::before, *::after { box-sizing: inherit; }

    .app-shell {
      min-height: 100vh; /* Ensure viewport fills */
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto; /* Enable scroll for app content */
    }

    .app-card {
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12); /* Light shadow */
      padding: 28px;
      box-sizing: border-box;
    }

    /* Adjustments for small screens */
    @media (max-width: 480px) {
      :root { font-size: clamp(15px, 2.8vw, 18px); } /* Slightly larger font size for small screens */
      .app-shell { padding: 12px; }
      .app-card { padding: 18px; border-radius: 10px; }
    }

    /* Iframe-specific styles */
    html.in-iframe body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto; /* Allow scroll within iframe */
    }

    html.in-iframe .app-shell {
      min-height: 100vh;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    html.in-iframe .app-card {
      max-width: 100%;
      width: 100%;
      border-radius: 0; /* Adapt card for iframe */
      box-shadow: none;
      padding: 0;
    }

  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-card" id="app-root">
      <h1 class="text-center" style="color:#ff7b00;">🍽️ Chontaduro Menu Generator</h1>

      <!-- Placeholder for dynamic content -->
      <div id="app" class="text-center">
        <div id="loading" class="py-10">
          <div class="loader mx-auto"></div>
          <p class="text-gray-600 mt-4">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Detect iframe and apply specific styles
    try {
      if (window.self !== window.top) {
        document.documentElement.classList.add('in-iframe');
        document.documentElement.style.height = '100%';
        document.documentElement.style.width = '100%';
        document.body.style.height = '100%';
        document.body.style.width = '100%';
        document.body.style.margin = '0';
        document.body.style.padding = '0';
      }
    } catch (e) {
      console.error(e);
    }

    const BASE = ""; // Base API path
    let sessionId = Math.random().toString(36).substring(2); // Generate a session ID
    let currentStep = "start"; // Current step tracking

    // Fetch data with timeout function
    async function fetchWithTimeout(resource, options = {}, timeout = 9000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('timeout')), timeout);
        fetch(resource, options)
          .then((response) => {
            clearTimeout(timer);
            resolve(response);
          })
          .catch((error) => {
            clearTimeout(timer);
            reject(error);
          });
      });
    }

    window.addEventListener('load', () => {
      ensureZipBeforeStart();
    });

    async function ensureZipBeforeStart() {
      await ensureZip();
      start();
    }

    async function start() {
      await step({}, "next");
    }

    async function step(answer = {}, action = "next") {
      document.getElementById("app").innerHTML = `
        <div class="py-8">
          <div class="loader mx-auto"></div>
          <p class="text-gray-600 mt-4">Loading...</p>
        </div>
      `;
      const payload = {
        session_id: sessionId,
        step: action === "back" ? "back" : currentStep,
        answer: answer,
      };

      try {
        const data = await api("/next-step", payload);
        if (data.menu) {
          renderMenu(data);
        } else {
          if (data.current_step) currentStep = data.current_step;
          renderForm(data.question, data.fields || []);
        }
      } catch (err) {
        document.getElementById("app").innerHTML = `
          <div class="text-red-600 p-4">Error: ${err.message}</div>
        `;
        console.error(err);
      }
    }

    /* Add complete remaining logic for modal, rendering menu, and dynamic APIs */
  </script>
</body>
</html>
