<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chontaduro Menu Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* --- Responsive typography & base --- */
    :root {
      /* Base font-size responsive: between 15px and 18px depending on viewport */
      font-size: clamp(15px, 1.0vw + 1.0px, 18px);
    }

/* Tamaño global de fuentes */
html, body {
  width: 100%;
  height: 100%; /* Permitir tamaño dinámico */
  margin: 0;
  padding: 0;
  background: #f7f3f0;
  font-family: Inter, sans-serif;
  overflow-y: auto; /* Mantén solo el scroll vertical */  
  overflow-x: hidden; /* Evitar desplazamiento horizontal */
  -webkit-overflow-scrolling: touch; /* Suaviza el desplazamiento en dispositivos iOS */
  transform: scale(1); /* Zoom al 100% */
  transform-origin: top left;
  box-sizing: border-box;
  font-size: 22px;
  line-height: 1.8;
}
    *, *::before, *::after { box-sizing: inherit; }

    /* Consulta de medios para pantallas pequeñas (ancho máximo: 480px) */
@media only screen and (max-width: 480px) {
  html, body {
    font-size: 18px; /* Asegura que sea legible en pantallas pequeñas */
    transform: scale(1); /* Mantener zoom al 100% */
  }
}

    /* App shell that always fills the viewport and centers content */
/* Elementos principales */
.app-shell {
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px; /* Ajusta espacio interno del contenedor */
  transition: padding .15s ease;
  overflow-y: auto; /* Habilitar el desplazamiento interno */
  -webkit-overflow-scrolling: touch; /* Suaviza scroll en iOS */
  display: flex;
  flex-direction: column; /* Asegura que el contenido pueda expandirse */
  /* Ajuste proporcional de tamaño de fuente dentro de la aplicación */
  font-size: 1.6em;
}

/* Inputs y selects (formularios) */
input, select {
  font-size: 1.3em;
  padding: 10px;
}

/* Botones */
button {
  font-size: 1.4em;
  padding: 10px 20px;
}

a {
  font-size: 1.3em; /* Links más visibles */
  text-decoration: underline;
}

    /* Card that grows responsively and keeps readable line-length */
    .app-card {
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      padding: 28px;
      box-sizing: border-box;
      font-size: 1rem;
      line-height: 1.45;
    }

    /* Headings */
    .app-card h1 { font-size: clamp(20px, 3.6vw, 32px); margin: 0 0 12px 0; }
    .app-card h2 { font-size: clamp(16px, 2.2vw, 20px); margin: 0 0 8px 0; }

    /* Loader */
    .loader { border-top-color: #ff7b00; animation: spin 1s linear infinite; border: 4px solid #e5e7eb; border-top-width:4px; border-radius:9999px; width:48px; height:48px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Modal styles (covers full viewport and is mobile-friendly) */
    #zipModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px; /* so modal never touches edges on small screens */
    }
    #zipModal {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      text-align:left;
    }
    #zipModal h2 { margin: 0 0 10px 0; }
    #zipModal input[type="text"] { width: 100%; padding: 10px; font-size: 1rem; margin: 8px 0 12px 0; box-sizing: border-box; }
    #zipModal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
    #zipModal .hint { font-size: 0.9rem; color: #666; margin-top:8px; }

    /* Banner and messages */
    #zipBanner { display:none; background:#fff4e5; border-left:4px solid #ffb74d; padding:10px 14px; margin-bottom: 12px; border-radius:6px; }
    #zipMessage { margin-top:8px; color: #b00020; }

    /* Make inputs and buttons more touch-friendly */
    button, input, select, textarea { -webkit-tap-highlight-color: rgba(0,0,0,0); }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      :root { font-size: clamp(15px, 2.8vw, 18px); } /* slightly larger base on very small screens */
      .app-shell { padding: 12px; align-items: flex-start; }
      .app-card { padding: 18px; border-radius: 10px; }
      #zipModal { padding: 14px; }
      #zipModal .actions { flex-direction: column-reverse; align-items: stretch; }
      #zipModal .actions button { width: 100%; }
    }

    @media (min-width: 1200px) {
      .app-shell { padding: 32px; }
      .app-card { padding: 40px; }
      :root { font-size: clamp(16px, 1.0vw + 1.5px, 19px); }
    }

    /* --- Iframe / embed specific rules --- */
    html.in-iframe body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
 /*   html.in-iframe .app-shell { min-height: 100vh; padding: 0; }*/
    
  html.in-iframe .app-shell {
  min-height: 100vh;
  width: 100vw;
  display: flex;
  padding: 0;
  margin: 0;
}

html.in-iframe .app-card {
  max-width: 100vw;
  width: 100vw;
  border-radius: 0;
  box-shadow: none;
  padding: 0;
  height: 100vh;
  overflow: hidden;
}
    html.in-iframe #zipModal { max-height: 88vh; overflow: auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-card" id="app-root">
      <h1 class="text-center" style="color:#ff7b00;">🍽️ Chontaduro Menu Generator</h1>

      <!-- Banner to show delivery state -->
      <div id="zipBanner" role="status" aria-live="polite"></div>

      <div id="app" class="text-center">
        <div id="loading" class="py-10">
          <div class="loader mx-auto"></div>
          <p class="text-gray-600 mt-4">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ZIP modal (overlay) -->
  <div id="zipModalOverlay" aria-hidden="true">
    <div id="zipModal" role="dialog" aria-modal="true" aria-labelledby="zipModalTitle">
      <h2 id="zipModalTitle">What is your postal code?</h2>
      <p>To verify if we deliver to your area, please enter your postal code.</p>
      <input id="zipInput" type="text" inputmode="numeric" maxlength="10" placeholder="Ex: 90210" aria-label="Zip code">
      <div id="zipMessage"></div>

      <div class="actions">
        <button id="zipContinueBtn" style="display:none;" class="px-4 py-2 bg-gray-300 rounded">Continue (Pickup only)</button>
        <button id="zipTryBtn" class="px-4 py-2 bg-orange-500 text-white rounded">Verify</button>
      </div>

      <div class="hint">You can change the postal code later in account or shipping information.</div>
    </div>
  </div>

<script>
    // If the page is inside an iframe, add a class so CSS can adapt
    try {
      if (window.self !== window.top) {
        document.documentElement.classList.add('in-iframe');
        // Slightly bump base font-size for readability inside small iframes
        document.documentElement.style.fontSize = '17px';
        // Ensure the iframe fills the parent's dimensions fully
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.body.style.width = "100%";
        document.body.style.height = "100vh";
        document.body.style.margin = "0";
        document.body.style.padding = "0";
        document.body.style.overflowY = "auto"; // Prevent scrolling inside iframe
      }

    } catch (e) {
      // cross-origin frame access can fail; ignore safely
    }

    const BASE = "";
    let sessionId = Math.random().toString(36).substring(2);
    let currentStep = "start";

    // --- Utility: fetch with timeout to handle cold starts gracefully ---
    function fetchWithTimeout(resource, options = {}, timeout = 9000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('timeout')), timeout);
        fetch(resource, options)
          .then((res) => {
            clearTimeout(timer);
            resolve(res);
          })
          .catch((err) => {
            clearTimeout(timer);
            reject(err);
          });
      });
    }

    // Small helper to display a friendly "server waking up" UI with retry
    function showServerWakeMessage(msg) {
      const zipMessage = document.getElementById('zipMessage');
      zipMessage.innerHTML = '';

      const p = document.createElement('div');
      p.style.color = '#b00020';
      p.style.marginBottom = '8px';
      p.textContent = msg || 'Error communicating with the server.';
      zipMessage.appendChild(p);

      const retryBtn = document.createElement('button');
      retryBtn.className = 'px-3 py-1 bg-blue-600 text-white rounded';
      retryBtn.textContent = 'Retry';
      retryBtn.onclick = () => {
        // trigger the verify flow again
        document.getElementById('zipTryBtn').click();
      };
      zipMessage.appendChild(retryBtn);

      const tip = document.createElement('div');
      tip.style.fontSize = '12px';
      tip.style.color = '#666';
      tip.style.marginTop = '8px';
      tip.textContent = 'If the server is sleeping, it may take a few seconds to wake up. Press Retry if it does not respond.';
      zipMessage.appendChild(tip);
    }

    // Generic API POST wrapper
    async function api(path, payload){
      const res = await fetch(BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || res.statusText);
      }
      return res.json();
    }

    window.addEventListener('load', () => {
      ensureZipBeforeStart();
    });

    async function ensureZipBeforeStart() {
      await ensureZip();
      start();
    }

    async function start(){
      await step({}, "next");
    }

    async function step(answer = {}, action = "next"){
      document.getElementById("app").innerHTML = `<div class="py-8"><div class="loader mx-auto"></div><p class="text-gray-600 mt-4">Loading...</p></div>`;
      const payload = { session_id: sessionId, step: (action === "back" ? "back" : currentStep), answer: answer };
      try {
        const data = await api("/next-step", payload);
        if (data.menu) {
          renderMenu(data);
        } else {
          if (data.current_step) currentStep = data.current_step;
          renderForm(data.question, data.fields || []);
        }
      } catch (err) {
        document.getElementById("app").innerHTML = `<div class="text-red-600 p-4">Error: ${err.message}</div>`;
        console.error(err);
      }
    }

    /* === The rest of your JS (renderForm, renderMenu, zip modal handlers etc.)
       is unchanged from your original file. Keep the existing functions below as-is. === */

    function renderForm(question, fields){
      let html = `<form id="f"><h2 class="text-lg font-semibold mb-4">${question}</h2>`;
      const enhanced = (fields || []).map(f => {
        const payloadKey = f.name.replace(/\s+/g, "_");
        return { ...f, payloadKey };
      });

      enhanced.forEach(f => {
        const requiredAttr = f.required ? "required" : "";
        html += `<div class="mb-3 text-left"><label class="block text-sm font-medium mb-1">${f.name}${f.unit ? ` (${f.unit})` : ''}${f.required ? ' *' : ''}</label>`;
        if (f.type === "select") {
          html += `<select name="${f.payloadKey}" class="w-full p-2 border rounded" ${requiredAttr}>`;
          (f.options || []).forEach(o => html += `<option value="${o}">${o}</option>`);
          html += `</select>`;
        } else if (f.type === "multiselect") {
          html += `<div class="grid gap-2">`;
          (f.options || []).forEach(o => {
            const id = `c-${f.payloadKey}-${o.replace(/\s+/g, "-")}`;
            html += `<label class="inline-flex items-center"><input type="checkbox" id="${id}" name="${f.payloadKey}" value="${o}" class="mr-2"> <span class="text-sm">${o}</span></label>`;
          });
          html += `</div>`;
        } else {
          html += `<input name="${f.payloadKey}" type="${f.type}" class="w-full p-2 border rounded" placeholder="${f.placeholder || ''}" ${requiredAttr}>`;
        }
        html += `</div>`;
      });

      html += `<div class="flex justify-between mt-4">`;
      if (currentStep !== "pick_plan") html += `<button type="button" id="back" class="px-4 py-2 bg-gray-300 rounded">← Back</button>`;
      else html += `<div></div>`;
      html += `<button type="submit" class="px-4 py-2 bg-orange-500 text-white rounded">Next →</button></div></form>`;

      document.getElementById("app").innerHTML = html;

      const form = document.getElementById("f");
      form.onsubmit = (e) => {
        e.preventDefault();
        // Validate required multiselects manually
        for (const f of enhanced) {
          if (f.type === "multiselect" && f.required) {
            const checked = Array.from(document.querySelectorAll(`input[name="${f.payloadKey}"]:checked`));
            if (checked.length === 0) {
              alert(`Please select at least one option for "${f.name}".`);
              return;
            }
          }
        }
        const fd = new FormData(form);
        const answer = {};
        enhanced.forEach(f => {
          if (f.type === "multiselect") {
            const vals = Array.from(document.querySelectorAll(`input[name="${f.payloadKey}"]:checked`)).map(i => i.value);
            answer[f.payloadKey] = vals;
          } else {
            const v = fd.get(f.payloadKey);
            if (v !== null) answer[f.payloadKey] = v;
          }
        });
        step(answer, "next");
      };

      const backBtn = document.getElementById("back");
      if (backBtn) backBtn.onclick = () => step({}, "back");
    }

    function renderMenu(data){
      let html = `<div class="flex justify-between items-center mb-3"><h2 class="text-xl font-bold">Your Menu</h2><div><button onclick="step({}, 'back')" class="px-3 py-1 bg-gray-200 rounded">← Adjust Preferences</button></div></div>`;
      html += `<div class="mb-4">Estimated price: <strong>$${(data.price || 0).toFixed(2)}</strong></div>`;
      if (data.nutrition) html += `<div class="mb-4 text-left p-3 bg-gray-50 rounded">TMB: ${data.nutrition.tmb||'N/A'} kcal — TDEE: ${data.nutrition.tdee||'N/A'} kcal — Target: ${data.nutrition.calorie_target||'N/A'} kcal</div>`;

      // Global add-protein control
      html += `<div class="mb-4 flex items-center justify-center gap-2">
        <label class="text-sm font-medium">Add extra protein (g):</label>
        <input id="extraProteinInput" type="number" min="0" value="0" class="w-24 p-2 border rounded" />
        <button id="addProteinBtn" class="px-3 py-2 bg-orange-500 text-white rounded">Add Protein (global)</button>
      </div>`;

      html += `<div class="space-y-3">`;

      (data.menu || []).forEach((m, idx) => {
        const ing = (m.ingredients || []).join(", ");
        const safeName = (m.name || "").replace(/'/g, "\\'");
        const protein = m.protein_assigned || m.provided_protein || 0;
        const carbs = m.carbs_assigned || 0;
        const fat = m.fat_assigned || 0;
        let perMealInfo = `<div class="text-sm text-gray-700"><strong>Protein:</strong> ${protein} g`;
        if (m.carbs_assigned !== undefined) perMealInfo += ` • <strong>Carbs:</strong> ${carbs} g`;
        if (m.fat_assigned !== undefined) perMealInfo += ` • <strong>Fat:</strong> ${fat} g`;
        perMealInfo += `</div>`;

        html += `<div class="p-3 bg-gray-50 rounded border">
          <div class="flex justify-between">
            <div class="text-left">
              <strong>${m.name}</strong>
              <div class="text-sm text-gray-600">${m.type} • ${m.calories || ''} kcal • $${(m.price||0).toFixed(2)}</div>
              <div class="mt-2 text-sm">Ingredients: ${ing}</div>
              <div class="mt-2">${perMealInfo}</div>
            </div>
            <div class="flex flex-col items-end gap-2">
              <button onclick="swapMeal('${safeName}')" class="px-2 py-1 bg-yellow-400 rounded text-xs">Swap</button>
              <div class="flex items-center gap-1">
                <input id="p-${idx}" type="number" min="0" placeholder="g" class="w-16 p-1 border rounded text-sm" />
                <button onclick="addProteinToMeal(${idx})" class="px-2 py-1 bg-green-500 text-white rounded text-xs">+Protein</button>
              </div>
            </div>
          </div>
        </div>`;
      });

      html += `</div>
        <div class="mt-4 flex gap-3 justify-center">
          <button onclick="redoMenu()" class="px-3 py-2 bg-blue-600 text-white rounded">Regenerate Full Menu</button>
        </div>

        <!-- Bottom Back button (explicit) -->
        <div class="mt-3 flex justify-center">
          <button onclick="step({}, 'back')" class="px-3 py-2 bg-gray-300 rounded">← Back</button>
        </div>

        <div class="mt-3 text-left">
          <label class="block text-sm">Tell us something we should know (notes):</label>
          <textarea id="note" class="w-full p-2 border rounded" rows="2"></textarea>
          <button id="saveNote" class="mt-2 px-3 py-2 bg-gray-800 text-white rounded">Save Note</button>
        </div>`;

      document.getElementById("app").innerHTML = html;

      document.getElementById("addProteinBtn").onclick = async () => {
        const val = Number(document.getElementById("extraProteinInput").value) || 0;
        if (val <= 0) { alert("Enter grams > 0"); return; }
        try {
          const res = await api("/add-protein", { session_id: sessionId, extra_protein_grams: val });
          renderMenu(res);
        } catch (e) { alert("Error adding protein"); console.error(e); }
      };

      const saveBtn = document.getElementById("saveNote");
      if (saveBtn) {
        saveBtn.onclick = async () => {
          const note = document.getElementById("note").value || "";
          try {
            await api("/add-note", { session_id: sessionId, note });
            alert("Note saved.");
          } catch (e) { alert("Error saving note"); }
        };
      }
    }

    async function addProteinToMeal(mealIndex){
      const inp = document.getElementById(`p-${mealIndex}`);
      const val = Number(inp.value) || 0;
      if (val <= 0) { alert("Enter grams > 0"); return; }
      try {
        const res = await api("/add-protein", { session_id: sessionId, extra_protein_grams: val, meal_index: mealIndex });
        renderMenu(res);
      } catch (e) { alert("Error adding protein"); console.error(e); }
    }

    async function swapMeal(name){
      if (!confirm(`Swap "${name}"?`)) return;
      try {
        const res = await api("/swap-meal", { session_id: sessionId, meal_to_swap: name });
        if (res.menu) renderMenu(res);
        else alert(res.message || "No replacement");
      } catch (e) { alert("Swap error"); console.error(e); }
    }

    async function redoMenu(){
      if (!confirm("Regenerate full menu?")) return;
      try {
        const res = await api("/redo-menu", { session_id: sessionId });
        if (res.menu) renderMenu(res);
        else alert(res.message || "Could not regenerate");
      } catch (e) { alert("Error"); console.error(e); }
    }

    // --- ZIP modal helpers and cold-start handling ---
    function getCartSubtotal(){ return window.cartSubtotal || 0.0; }

    async function validateSavedZip(savedZip) {
      try {
        const resp = await callCheckZip(savedZip);
        if (resp && !resp.error) {
          if (resp.can_deliver) {
            const banner = document.getElementById('zipBanner');
            banner.style.display='block';
            banner.textContent = `We deliver to ${savedZip}.`;
            return true;
          } else {
            const banner = document.getElementById('zipBanner');
            banner.style.display='block';
            banner.textContent = `We do not deliver to ${savedZip}. Pickup only.`;
            return true; // treat as OK (user confirmed previously)
          }
        }
        return false;
      } catch (e) {
        console.warn('ZIP validation failed', e);
        return false;
      }
    }

    function showModal(){ document.getElementById('zipModalOverlay').style.display = 'flex'; document.getElementById('zipModalOverlay').setAttribute('aria-hidden','false'); }
    function hideModal(){ document.getElementById('zipModalOverlay').style.display = 'none'; document.getElementById('zipModalOverlay').setAttribute('aria-hidden','true'); }

    async function callCheckZip(zip) {
      try {
        const res = await fetchWithTimeout('/api/check-zip', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ zipcode: String(zip).trim(), subtotal: getCartSubtotal() })
        }, 9000); // 9s timeout
        if (!res.ok) {
          const txt = await res.text();
          return { error: true, message: txt || res.statusText, status: res.status };
        }
        return await res.json();
      } catch (e) {
        // return a standardized error shape for the caller
        return { error:true, message: e.message === 'timeout' ? 'Server is taking too long to respond (timeout).' : 'Network error or the server may be sleeping.', status: 0 };
      }
    }

    // Promise that resolves once zip is provided/confirmed
    function ensureZip() {
      return new Promise(async (resolve) => {
        const saved = localStorage.getItem('user_zip');
        const zipInput = document.getElementById('zipInput');
        const zipTryBtn = document.getElementById('zipTryBtn');
        const zipContinueBtn = document.getElementById('zipContinueBtn');
        const zipMessage = document.getElementById('zipMessage');

        if (saved && zipInput) zipInput.value = saved;

        // Show modal
        showModal();

        // If there's a saved ZIP, try validating it quickly (non-blocking for user)
        if (saved) {
          zipMessage.textContent = 'Validating saved ZIP...';
          const ok = await validateSavedZip(saved);
          zipMessage.textContent = '';
          if (ok) {
            // let user still confirm/change: prefilled field is there
          }
        }

        // Handlers
        const tryHandler = async () => {
          zipMessage.textContent = '';
          const zip = (zipInput && zipInput.value && zipInput.value.trim()) || '';
          if (!zip || zip.length < 3) { zipMessage.textContent = 'Please enter a valid postal code.'; return; }
          zipTryBtn.disabled = true; zipTryBtn.textContent = 'Verifying...';
          const resp = await callCheckZip(zip);
          zipTryBtn.disabled = false; zipTryBtn.textContent = 'Verify';
          if (!resp || resp.error) {
            // Friendly retry UI for cold start / server errors
            showServerWakeMessage(resp && resp.message ? resp.message : 'Error communicating with the server.');
            return;
          }
          if (resp.can_deliver) {
            localStorage.setItem('user_zip', zip);
            const banner = document.getElementById('zipBanner');
            banner.style.display='block'; banner.textContent = `Great! We deliver to ${zip}.`;
            cleanupAndResolve();
          } else {
            zipMessage.textContent = resp.message || 'We do not deliver to this ZIP.';
            zipContinueBtn.style.display = 'inline-block';
          }
        };

        const continueHandler = () => {
          const zip = (zipInput && zipInput.value && zipInput.value.trim()) || '';
          if (!zip) { zipMessage.textContent = 'Enter a postal code to continue.'; return; }
          localStorage.setItem('user_zip', zip);
          const banner = document.getElementById('zipBanner');
          banner.style.display='block'; banner.textContent = `You continued with ${zip}. Note: pickup only.`;
          cleanupAndResolve();
        };

        function cleanupAndResolve() {
          hideModal();
          zipTryBtn.removeEventListener('click', tryHandler);
          zipContinueBtn.removeEventListener('click', continueHandler);
          zipInput.removeEventListener('keydown', keyHandler);
          resolve();
        }

        const keyHandler = (e) => { if (e.key === 'Enter') tryHandler(); };
        zipTryBtn.addEventListener('click', tryHandler);
        zipContinueBtn.addEventListener('click', continueHandler);
        zipInput.addEventListener('keydown', keyHandler);

        // focus
        setTimeout(() => { zipInput && zipInput.focus(); }, 120);
      });
    }
  </script>
</body>
</html>
