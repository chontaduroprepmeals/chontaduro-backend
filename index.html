<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chontaduro Menu Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, sans-serif; background: #f7f3f0; }
    .loader { border-top-color: #ff7b00; animation: spin 1s linear infinite; border: 4px solid #e5e7eb; border-top-width:4px; border-radius:9999px; width:48px; height:48px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    /* Modal styles */
    #zipModalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 9999; }
    #zipModal { background: white; padding: 20px; width: min(520px, 95%); border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); text-align: left; }
    #zipModal h2 { margin: 0 0 10px 0; }
    #zipModal input[type="text"] { width: 100%; padding: 10px; font-size: 16px; margin: 8px 0 12px 0; box-sizing: border-box; }
    #zipModal .actions { display:flex; gap:8px; justify-content:flex-end; }
    #zipModal .hint { font-size: 13px; color: #666; margin-top:8px; }
    #zipMessage { margin-top:8px; color: #b00020; }
    #zipBanner { display:none; background:#fff4e5; border-left:4px solid #ffb74d; padding:10px 14px; margin-bottom: 12px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow">
    <h1 class="text-2xl font-bold text-center mb-6" style="color:#ff7b00;">🍽️ Chontaduro Menu Generator</h1>
    <div id="app" class="text-center">
      <div id="loading" class="py-10">
        <div class="loader mx-auto"></div>
        <p class="text-gray-600 mt-4">Loading...</p>
      </div>
    </div>
  </div>

  <!-- Banner para mostrar estado de delivery -->
  <div id="zipBanner" role="status"></div>

  <!-- Modal de ZIP (insertado) -->
  <div id="zipModalOverlay" aria-hidden="true">
    <div id="zipModal" role="dialog" aria-modal="true" aria-labelledby="zipModalTitle">
      <h2 id="zipModalTitle">¿Cuál es tu código postal?</h2>
      <p>Para verificar si hacemos entrega en tu zona, por favor ingresa tu ZIP.</p>
      <input id="zipInput" type="text" inputmode="numeric" maxlength="10" placeholder="Ej: 90210" aria-label="Código postal">
      <div id="zipMessage"></div>
      <div class="actions">
        <button id="zipTryBtn" class="px-4 py-2 bg-orange-500 text-white rounded">Verificar</button>
        <button id="zipContinueBtn" style="display:none;" class="px-4 py-2 bg-gray-300 rounded">Continuar (solo pickup)</button>
      </div>
      <div class="hint">Puedes cambiar el código más tarde en la sección de cuenta o información de envío.</div>
    </div>
  </div>

  <script>
    const BASE = "";
    let sessionId = Math.random().toString(36).substring(2);
    let currentStep = "start";

    async function api(path, payload){
      const res = await fetch(BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || res.statusText);
      }
      return res.json();
    }

    // --- START / STEP functions (unchanged) ---
    window.addEventListener('load', () => {
      // We will call ensureZipBeforeStart() which awaits user zip, then starts app
      ensureZipBeforeStart();
    });

    async function ensureZipBeforeStart() {
      // Wait until user has provided/confirmed ZIP (or validated saved ZIP)
      await ensureZip();
      // Start the app only after zip step is done
      start();
    }

    async function start(){
      await step({}, "next");
    }

    async function step(answer = {}, action = "next"){
      document.getElementById("app").innerHTML = `<div class="py-8"><div class="loader mx-auto"></div><p class="text-gray-600 mt-4">Loading...</p></div>`;
      const payload = { session_id: sessionId, step: (action === "back" ? "back" : currentStep), answer: answer };
      try {
        const data = await api("/next-step", payload);
        if (data.menu) {
          renderMenu(data);
        } else {
          if (data.current_step) currentStep = data.current_step;
          renderForm(data.question, data.fields || []);
        }
      } catch (err) {
        document.getElementById("app").innerHTML = `<div class="text-red-600 p-4">Error: ${err.message}</div>`;
        console.error(err);
      }
    }

    function renderForm(question, fields){
      let html = `<form id="f"><h2 class="text-lg font-semibold mb-4">${question}</h2>`;
      const enhanced = (fields || []).map(f => {
        const payloadKey = f.name.replace(/\s+/g, "_");
        return { ...f, payloadKey };
      });

      enhanced.forEach(f => {
        const requiredAttr = f.required ? "required" : "";
        html += `<div class="mb-3 text-left"><label class="block text-sm font-medium mb-1">${f.name}${f.unit ? ` (${f.unit})` : ''}${f.required ? ' *' : ''}</label>`;
        if (f.type === "select") {
          html += `<select name="${f.payloadKey}" class="w-full p-2 border rounded" ${requiredAttr}>`;
          (f.options || []).forEach(o => html += `<option value="${o}">${o}</option>`);
          html += `</select>`;
        } else if (f.type === "multiselect") {
          html += `<div class="grid gap-2">`;
          (f.options || []).forEach(o => {
            const id = `c-${f.payloadKey}-${o.replace(/\s+/g, "-")}`;
            html += `<label class="inline-flex items-center"><input type="checkbox" id="${id}" name="${f.payloadKey}" value="${o}" class="mr-2"> <span class="text-sm">${o}</span></label>`;
          });
          html += `</div>`;
        } else {
          html += `<input name="${f.payloadKey}" type="${f.type}" class="w-full p-2 border rounded" placeholder="${f.placeholder || ''}" ${requiredAttr}>`;
        }
        html += `</div>`;
      });

      html += `<div class="flex justify-between mt-4">`;
      if (currentStep !== "pick_plan") html += `<button type="button" id="back" class="px-4 py-2 bg-gray-300 rounded">← Back</button>`;
      else html += `<div></div>`;
      html += `<button type="submit" class="px-4 py-2 bg-orange-500 text-white rounded">Next →</button></div></form>`;

      document.getElementById("app").innerHTML = html;

      const form = document.getElementById("f");
      form.onsubmit = (e) => {
        e.preventDefault();
        // Validate required multiselects manually
        for (const f of enhanced) {
          if (f.type === "multiselect" && f.required) {
            const checked = Array.from(document.querySelectorAll(`input[name="${f.payloadKey}"]:checked`));
            if (checked.length === 0) {
              alert(`Please select at least one option for "${f.name}".`);
              return;
            }
          }
        }
        const fd = new FormData(form);
        const answer = {};
        enhanced.forEach(f => {
          if (f.type === "multiselect") {
            const vals = Array.from(document.querySelectorAll(`input[name="${f.payloadKey}"]:checked`)).map(i => i.value);
            answer[f.payloadKey] = vals;
          } else {
            const v = fd.get(f.payloadKey);
            if (v !== null) answer[f.payloadKey] = v;
          }
        });
        step(answer, "next");
      };

      const backBtn = document.getElementById("back");
      if (backBtn) backBtn.onclick = () => step({}, "back");
    }

    function renderMenu(data){
      let html = `<div class="flex justify-between items-center mb-3"><h2 class="text-xl font-bold">Your Menu</h2><div><button onclick="step({}, 'back')" class="px-3 py-1 bg-gray-200 rounded">← Adjust Preferences</button></div></div>`;
      html += `<div class="mb-4">Estimated price: <strong>$${(data.price || 0).toFixed(2)}</strong></div>`;
      if (data.nutrition) html += `<div class="mb-4 text-left p-3 bg-gray-50 rounded">TMB: ${data.nutrition.tmb||'N/A'} kcal — TDEE: ${data.nutrition.tdee||'N/A'} kcal — Target: ${data.nutrition.calorie_target||'N/A'} kcal</div>`;

      // Global add-protein control
      html += `<div class="mb-4 flex items-center justify-center gap-2">
        <label class="text-sm font-medium">Add extra protein (g):</label>
        <input id="extraProteinInput" type="number" min="0" value="0" class="w-24 p-2 border rounded" />
        <button id="addProteinBtn" class="px-3 py-2 bg-orange-500 text-white rounded">Add Protein (global)</button>
      </div>`;

      html += `<div class="space-y-3">`;

      (data.menu || []).forEach((m, idx) => {
        const ing = (m.ingredients || []).join(", ");
        const safeName = (m.name || "").replace(/'/g, "\\'");
        const protein = m.protein_assigned || m.provided_protein || 0;
        const carbs = m.carbs_assigned || 0;
        const fat = m.fat_assigned || 0;
        let perMealInfo = `<div class="text-sm text-gray-700"><strong>Protein:</strong> ${protein} g`;
        if (m.carbs_assigned !== undefined) perMealInfo += ` • <strong>Carbs:</strong> ${carbs} g`;
        if (m.fat_assigned !== undefined) perMealInfo += ` • <strong>Fat:</strong> ${fat} g`;
        perMealInfo += `</div>`;

        html += `<div class="p-3 bg-gray-50 rounded border">
          <div class="flex justify-between">
            <div class="text-left">
              <strong>${m.name}</strong>
              <div class="text-sm text-gray-600">${m.type} • ${m.calories || ''} kcal • $${(m.price||0).toFixed(2)}</div>
              <div class="mt-2 text-sm">Ingredients: ${ing}</div>
              <div class="mt-2">${perMealInfo}</div>
            </div>
            <div class="flex flex-col items-end gap-2">
              <button onclick="swapMeal('${safeName}')" class="px-2 py-1 bg-yellow-400 rounded text-xs">Swap</button>
              <div class="flex items-center gap-1">
                <input id="p-${idx}" type="number" min="0" placeholder="g" class="w-16 p-1 border rounded text-sm" />
                <button onclick="addProteinToMeal(${idx})" class="px-2 py-1 bg-green-500 text-white rounded text-xs">+Protein</button>
              </div>
            </div>
          </div>
        </div>`;
      });

      html += `</div>
        <div class="mt-4 flex gap-3 justify-center">
          <button onclick="redoMenu()" class="px-3 py-2 bg-blue-600 text-white rounded">Regenerate Full Menu</button>
        </div>

        <!-- Bottom Back button (explicit) -->
        <div class="mt-3 flex justify-center">
          <button onclick="step({}, 'back')" class="px-3 py-2 bg-gray-300 rounded">← Back</button>
        </div>

        <div class="mt-3 text-left">
          <label class="block text-sm">Tell us something we should know (notes):</label>
          <textarea id="note" class="w-full p-2 border rounded" rows="2"></textarea>
          <button id="saveNote" class="mt-2 px-3 py-2 bg-gray-800 text-white rounded">Save Note</button>
        </div>`;

      document.getElementById("app").innerHTML = html;

      document.getElementById("addProteinBtn").onclick = async () => {
        const val = Number(document.getElementById("extraProteinInput").value) || 0;
        if (val <= 0) { alert("Enter grams > 0"); return; }
        try {
          const res = await api("/add-protein", { session_id: sessionId, extra_protein_grams: val });
          renderMenu(res);
        } catch (e) { alert("Error adding protein"); console.error(e); }
      };

      const saveBtn = document.getElementById("saveNote");
      if (saveBtn) {
        saveBtn.onclick = async () => {
          const note = document.getElementById("note").value || "";
          try {
            await api("/add-note", { session_id: sessionId, note });
            alert("Note saved.");
          } catch (e) { alert("Error saving note"); }
        };
      }
    }

    async function addProteinToMeal(mealIndex){
      const inp = document.getElementById(`p-${mealIndex}`);
      const val = Number(inp.value) || 0;
      if (val <= 0) { alert("Enter grams > 0"); return; }
      try {
        const res = await api("/add-protein", { session_id: sessionId, extra_protein_grams: val, meal_index: mealIndex });
        renderMenu(res);
      } catch (e) { alert("Error adding protein"); console.error(e); }
    }

    async function swapMeal(name){
      if (!confirm(`Swap "${name}"?`)) return;
      try {
        const res = await api("/swap-meal", { session_id: sessionId, meal_to_swap: name });
        if (res.menu) renderMenu(res);
        else alert(res.message || "No replacement");
      } catch (e) { alert("Swap error"); console.error(e); }
    }

    async function redoMenu(){
      if (!confirm("Regenerate full menu?")) return;
      try {
        const res = await api("/redo-menu", { session_id: sessionId });
        if (res.menu) renderMenu(res);
        else alert(res.message || "Could not regenerate");
      } catch (e) { alert("Error"); console.error(e); }
    }

    // --- ZIP modal helpers ---
    function getCartSubtotal(){ return window.cartSubtotal || 0.0; }

    async function validateSavedZip(savedZip) {
      try {
        const res = await fetch('/api/check-zip', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ zipcode: savedZip, subtotal: getCartSubtotal() })
        });
        if (!res.ok) return false;
        const data = await res.json();
        if (data.can_deliver) {
          const banner = document.getElementById('zipBanner');
          banner.style.display='block';
          banner.textContent = `Hacemos delivery en ${savedZip}.`;
          return true;
        } else {
          const banner = document.getElementById('zipBanner');
          banner.style.display='block';
          banner.textContent = `No hacemos entrega en ${savedZip}. Solo pickup disponible.`;
          return true; // treat as OK (user confirmed previously)
        }
      } catch (e) {
        console.warn('ZIP validation failed', e);
        return false;
      }
    }

    function showModal(){ document.getElementById('zipModalOverlay').style.display = 'flex'; document.getElementById('zipModalOverlay').setAttribute('aria-hidden','false'); }
    function hideModal(){ document.getElementById('zipModalOverlay').style.display = 'none'; document.getElementById('zipModalOverlay').setAttribute('aria-hidden','true'); }

    async function callCheckZip(zip) {
      try {
        const res = await fetch('/api/check-zip', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ zipcode: String(zip).trim(), subtotal: getCartSubtotal() })
        });
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || 'Server error');
        }
        return await res.json();
      } catch (e) {
        return { error:true, message: e.message || 'Error' };
      }
    }

    // Promise that resolves once zip is provided/confirmed
    function ensureZip() {
      return new Promise(async (resolve) => {
        const saved = localStorage.getItem('user_zip');
        if (saved) {
          // try validate saved zip (best-effort) then resolve
          const ok = await validateSavedZip(saved);
          if (ok) return resolve();
        }

        // show modal and wire handlers (one-time)
        showModal();
        const zipInput = document.getElementById('zipInput');
        const zipTryBtn = document.getElementById('zipTryBtn');
        const zipContinueBtn = document.getElementById('zipContinueBtn');
        const zipMessage = document.getElementById('zipMessage');

        // Handlers
        const tryHandler = async () => {
          zipMessage.textContent = '';
          const zip = (zipInput && zipInput.value && zipInput.value.trim()) || '';
          if (!zip || zip.length < 3) { zipMessage.textContent = 'Ingresa un código postal válido.'; return; }
          zipTryBtn.disabled = true; zipTryBtn.textContent = 'Verificando...';
          const resp = await callCheckZip(zip);
          zipTryBtn.disabled = false; zipTryBtn.textContent = 'Verificar';
          if (!resp || resp.error) {
            zipMessage.textContent = 'Error comunicándose con el servidor.';
            return;
          }
          if (resp.can_deliver) {
            localStorage.setItem('user_zip', zip);
            const banner = document.getElementById('zipBanner');
            banner.style.display='block'; banner.textContent = `¡Excelente! Hacemos entrega en ${zip}.`;
            cleanupAndResolve();
          } else {
            zipMessage.textContent = resp.message || 'No hacemos entrega en este ZIP.';
            zipContinueBtn.style.display = 'inline-block';
          }
        };

        const continueHandler = () => {
          const zip = (zipInput && zipInput.value && zipInput.value.trim()) || '';
          if (!zip) { zipMessage.textContent = 'Ingresa un código postal para continuar.'; return; }
          localStorage.setItem('user_zip', zip);
          const banner = document.getElementById('zipBanner');
          banner.style.display='block'; banner.textContent = `Has continuado con ${zip}. Nota: solo pickup disponible.`;
          cleanupAndResolve();
        };

        function cleanupAndResolve() {
          hideModal();
          zipTryBtn.removeEventListener('click', tryHandler);
          zipContinueBtn.removeEventListener('click', continueHandler);
          zipInput.removeEventListener('keydown', keyHandler);
          resolve();
        }

        const keyHandler = (e) => { if (e.key === 'Enter') tryHandler(); };
        zipTryBtn.addEventListener('click', tryHandler);
        zipContinueBtn.addEventListener('click', continueHandler);
        zipInput.addEventListener('keydown', keyHandler);

        // focus
        setTimeout(() => { zipInput && zipInput.focus(); }, 120);
      });
    }

  </script>
</body>
</html>
