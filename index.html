<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ Chontaduro Menu Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f3f0; }
    .loader { border-color: #f3f3f3; border-top-color: #ff7b00; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .modal-overlay { background-color: rgba(0, 0, 0, 0.5); z-index: 50; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-2xl border border-gray-100 relative">
    <h1 class="text-3xl font-bold text-center mb-6" style="color: #ff7b00;">🍽️ Chontaduro Menu Generator</h1>
    <div id="app" class="text-center">
      <div class="py-10">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto" style="border-top-color: #ff7b00;"></div>
        <p class="text-gray-600">Cargando...</p>
      </div>
    </div>
  </div>

  <div id="customModal" class="modal-overlay fixed inset-0 hidden items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-all">
      <h3 id="modalTitle" class="text-xl font-bold mb-3 text-gray-900"></h3>
      <p id="modalMessage" class="text-gray-700 mb-6"></p>
      <div class="flex justify-end space-x-3">
        <button id="modalCancel" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-lg transition duration-150">Cancelar</button>
        <button id="modalConfirm" class="font-medium py-2 px-4 rounded-lg transition duration-150" style="background-color: #ff7b00; color: white;">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "https://chontaduro-backend.onrender.com";
    let sessionId = Math.random().toString(36).substring(2);
    let currentStepName = "start";

    // Add the new fields mapping so payload keys are machine-friendly
    const FIELD_KEY_MAP = {
      "Plan": "plan",
      "Días": "days",
      "Dias": "days",
      "Ingredientes_No_Deseados": "dislikes",
      "Alergias": "allergies",
      "Gramos_Extra_Proteína": "extra_protein_grams",
      "Gramos_Extra_Proteina": "extra_protein_grams",
      "Objective": "objective",
      "Weight": "weight",
      "Weight Unit": "weight_unit",
      "Height": "height",
      "Height Unit": "height_unit",
      "Age": "age",
      "Sex": "sex",
      "Activity Level": "activity_level",
      "Body Fat % (optional)": "body_fat"
    };

    const STEPS_FALLBACK = {
      "start": "pick_plan",
      "pick_plan": "objective",
      "objective": "personal_info",
      "personal_info": "duration",
      "duration": "dislikes",
      "dislikes": "allergies",
      "allergies": "extra_protein",
      "extra_protein": "review"
    };

    function showConfirmation(title, message, onConfirm) {
      const modal = document.getElementById("customModal");
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMessage").textContent = message;
      const confirmBtn = document.getElementById("modalConfirm");
      const cancelBtn = document.getElementById("modalCancel");
      const newConfirmBtn = confirmBtn.cloneNode(true);
      const newCancelBtn = cancelBtn.cloneNode(true);
      confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
      cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
      const closeModal = () => modal.classList.add('hidden');
      newConfirmBtn.onclick = () => { closeModal(); onConfirm(); };
      newCancelBtn.onclick = closeModal;
      modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    async function apiRequest(endpoint, payload) {
      const url = `${BASE_URL}${endpoint}`;
      try {
        const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (!response.ok) {
          let errorData;
          try { errorData = await response.json(); } catch (e) { errorData = { detail: await response.text() }; }
          const errorMsg = (errorData && errorData.detail) ? JSON.stringify(errorData.detail) : `HTTP ${response.status}`;
          throw new Error(errorMsg);
        }
        return await response.json();
      } catch (err) {
        console.error("API Request Failed:", err);
        document.getElementById("app").innerHTML = `
          <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mt-4 text-left">
            <strong class="font-bold block mb-1">❌ Communication Error</strong>
            <span class="block text-sm">Cause: ${err.message || 'Network/CORS error.'}</span>
            <span class="block text-xs text-red-500 mt-2">Ensure your backend URL is correct and the service is running.</span>
            <button onclick="window.location.reload();" class="mt-3 bg-red-500 hover:bg-red-600 text-white font-medium py-1 px-3 rounded-lg text-xs">Reload</button>
          </div>`;
        throw err;
      }
    }

    async function fetchStep(answer = {}, nextStepAction = 'next') {
      document.getElementById("app").innerHTML = `<div class="py-10"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto" style="border-top-color: #ff7b00;"></div><p class="text-gray-600">Loading...</p></div>`;
      const stepToSend = nextStepAction === 'back' ? 'back' : currentStepName;
      const payload = { session_id: sessionId, step: stepToSend, answer: answer };
      try {
        const data = await apiRequest("/next-step", payload);
        if (data.menu) {
          showMenu(data);
        } else {
          if (data.current_step) {
            currentStepName = data.current_step;
          } else {
            currentStepName = STEPS_FALLBACK[currentStepName] || currentStepName;
          }
          showForm(data.question, data.fields || []);
        }
      } catch (error) {
        console.error("Error during step transition:", error);
      }
    }

    function handleFormSubmit(e, fieldsMeta) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const answer = {};
      fieldsMeta.forEach(f => {
        const key = f.payloadKey || FIELD_KEY_MAP[f.name] || f.name;
        const values = formData.getAll(key);
        if (f.type === 'multiselect') {
          answer[key] = values;
        } else {
          const val = values && values[0] !== undefined ? values[0] : "";
          if (f.type === 'number') {
            answer[key] = val === "" ? null : Number(val);
          } else {
            answer[key] = val;
          }
        }
      });
      Object.keys(answer).forEach(k => { if (answer[k] === null || answer[k] === "") delete answer[k]; });
      fetchStep(answer, 'next');
    }

    function handleBack() { fetchStep({}, 'back'); }

    function showForm(question, fields) {
      let formHtml = `<form id="stepForm" class="p-6"><h2 class="text-xl font-semibold mb-6 text-gray-800">${question}</h2>`;
      const enhancedFields = (fields || []).map(f => {
        const displayName = f.name || f.label || "field";
        const payloadKey = FIELD_KEY_MAP[displayName] || displayName.replace(/\s+/g, "_").normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
        return { ...f, name: displayName, payloadKey };
      });

      enhancedFields.forEach(f => {
        const inputId = `input-${(f.payloadKey || f.name).replace(/\s/g, '-')}`;
        formHtml += `<div class="mb-4"><label for="${inputId}" class="block text-sm font-medium text-gray-700 mb-1">${f.name} ${f.unit ? `(${f.unit})` : ''}</label>`;
        if (f.type === "select" || f.type === "multiselect") {
          const isMultiple = f.type === "multiselect" ? 'multiple' : '';
          const sizeAttr = f.type === "multiselect" ? 'size="5"' : '';
          formHtml += `<select id="${inputId}" name="${f.payloadKey}" ${isMultiple} ${sizeAttr} class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm rounded-md shadow-sm">`;
          (f.options || []).forEach(o => { formHtml += `<option value="${o}">${o}</option>`; });
          formHtml += `</select>`;
        } else {
          const minAttr = f.min !== undefined ? `min="${f.min}"` : '';
          const maxAttr = f.max !== undefined ? `max="${f.max}"` : '';
          const placeholderAttr = f.placeholder ? `placeholder="${f.placeholder}"` : '';
          const requiredAttr = f.required ? 'required' : '';
          formHtml += `<input type="${f.type}" id="${inputId}" name="${f.payloadKey}" ${requiredAttr} ${minAttr} ${maxAttr} ${placeholderAttr} class="shadow-sm focus:ring-orange-500 focus:border-orange-500 block w-full sm:text-sm border-gray-300 rounded-md p-2" />`;
        }
        formHtml += `</div>`;
      });

      formHtml += `<div class="flex justify-between mt-8">`;
      if (currentStepName !== 'pick_plan') {
        formHtml += `<button type="button" id="backBtn" class="bg-gray-400 hover:bg-gray-500 text-white font-medium py-2 px-4 rounded-lg transition duration-150">← Back</button>`;
      } else {
        formHtml += '<div></div>';
      }
      formHtml += `<button type="submit" class="font-medium py-2 px-4 rounded-lg transition duration-150" style="background-color: #ff7b00; color: white;">Next →</button>`;
      formHtml += `</div></form>`;

      const appDiv = document.getElementById("app");
      appDiv.innerHTML = formHtml;
      document.getElementById("stepForm").onsubmit = (e) => handleFormSubmit(e, enhancedFields);
      const backBtn = document.getElementById("backBtn");
      if (backBtn) backBtn.onclick = handleBack;
    }

    function showMenu(data) {
      let menuHtml = `<h2 class="text-2xl font-bold mb-4 text-gray-800">Your Menu is Ready!</h2><p class="text-lg font-medium mb-6 text-gray-600">Estimated Total Price: <span class="text-2xl font-extrabold text-green-600">$${(data.price||0).toFixed(2)}</span></p>`;
      if (data.nutrition) {
        menuHtml += `<div class="mb-4 text-left p-4 bg-gray-50 rounded-md border border-gray-200"><strong>Nutrition summary:</strong><div class="text-sm mt-2">TMB: ${data.nutrition.tmb || 'N/A'} kcal<br/>TDEE: ${data.nutrition.tdee || 'N/A'} kcal<br/>Target Calories: ${data.nutrition.calorie_target || 'N/A'} kcal<br/>Protein: ${data.nutrition.macros.protein_grams || 0} g | Fat: ${data.nutrition.macros.fat_grams || 0} g | Carbs: ${data.nutrition.macros.carbs_grams || 0} g</div></div>`;
      }
      menuHtml += `<div id="menu" class="space-y-4 max-h-[400px] overflow-y-auto pr-2">`;
      (data.menu||[]).forEach(m => {
        menuHtml += `<div class="meal bg-gray-50 p-4 rounded-lg shadow-sm border border-gray-200 flex items-center">${m.image_url ? `<img src="${m.image_url}" alt="${m.name}" class="w-16 h-16 object-cover rounded-md mr-4">` : ''}<div class="flex-grow"><strong class="text-base text-gray-900">${m.name}</strong><span class="text-sm text-gray-500"> (${m.type})</span><br><span class="text-sm text-gray-700">${m.calories} kcal - $${(m.price||0).toFixed(2)}</span></div><button onclick="handleSwapMeal('${m.name.replace(/'/g, "\\'")}')" class="ml-4 bg-yellow-500 text-white text-xs font-semibold py-1 px-3 rounded-full hover:bg-yellow-600 transition duration-150 shadow-md">Swap</button></div>`;
      });
      menuHtml += `</div><div class="mt-6 flex justify-center space-x-4"><button onclick="handleRedoMenu()" class="bg-blue-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-150 shadow-lg">Regenerate Full Menu</button></div><div class="mt-4 text-center"><button onclick="fetchStep({}, 'back')" class="text-gray-500 hover:text-gray-700 text-sm">← Adjust Preferences</button></div>`;
      document.getElementById("app").innerHTML = menuHtml;
    }

    async function handleSwapMeal(mealName) {
      showConfirmation("Confirm Swap", `Swap "${mealName}" for a compatible alternative?`, async () => {
        const payload = { session_id: sessionId, meal_to_swap: mealName };
        try {
          const data = await apiRequest("/swap-meal", payload);
          if (data && data.menu) showMenu(data);
          else if (data.message) showConfirmation("Notice", data.message, () => {});
        } catch (e) { console.error(e); }
      });
    }

    async function handleRedoMenu() {
      showConfirmation("Confirm Regenerate", "Regenerate full menu (this will override individual swaps)?", async () => {
        const payload = { session_id: sessionId };
        try {
          const data = await apiRequest("/redo-menu", payload);
          if (data && data.menu) showMenu(data);
          else if (data.message) showConfirmation("Notice", data.message, () => {});
        } catch (e) { console.error(e); }
      });
    }

    window.onload = () => { fetchStep({}, 'next'); };
  </script>
</body>
</html>
