<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ Chontaduro Menu Generator</title>
  <!-- Usando Tailwind CSS para un diseño limpio y moderno (se carga desde CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f3f0; /* Color crema suave */
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-2xl border border-gray-100">
    <h1 class="text-3xl font-bold text-center mb-6" style="color: #ff7b00;">
      🍽️ Chontaduro Menu Generator
    </h1>

    <div id="app" class="text-center">
      <div class="py-10">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto" style="border-top-color: #ff7b00;"></div>
        <p class="text-gray-600">Loading...</p>
      </div>
    </div>
  </div>

  <script>
    // CRÍTICO: Usa la URL absoluta de Render para evitar errores de CORS/Failed to Fetch
    const BASE_URL = "https://chontaduro-backend.onrender.com"; 
    
    let sessionId = Math.random().toString(36).substring(2);
    let currentStepName = "start"; // Usamos 'start' para la primera llamada
    let history = []; // Almacena el estado para la navegación "Back"

    /**
     * Helper para manejar las peticiones Fetch al backend.
     * @param {string} endpoint - La parte final de la URL (ej: '/next-step').
     * @param {Object} payload - Los datos a enviar en el cuerpo de la petición.
     * @returns {Promise<Object>} La respuesta JSON del servidor.
     */
    async function apiRequest(endpoint, payload) {
      const url = `${BASE_URL}${endpoint}`;
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          // Si el servidor responde con un error HTTP (ej: 400, 500)
          const errorData = await response.json();
          throw new Error(`HTTP Error ${response.status}: ${errorData.detail || 'Server error'}`);
        }
        return await response.json();

      } catch (err) {
        // Si hay un error de red (Failed to fetch, CORS, DNS)
        console.error("API Request Failed:", err);
        document.getElementById("app").innerHTML = `
          <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mt-4">
            <strong class="font-bold">❌ Error: Failed to fetch.</strong>
            <span class="block sm:inline">Check network connection or console for details.</span>
          </div>`;
        throw err; // Propaga el error para detener el flujo
      }
    }

    /**
     * Inicia el flujo o avanza al siguiente paso.
     * @param {Object} answer - Respuesta del formulario del paso anterior.
     * @param {string} nextStepAction - 'next' o 'back'.
     */
    async function fetchStep(answer = {}, nextStepAction = 'next') {
      const stepToSend = nextStepAction === 'back' ? 'back' : currentStepName;
      
      const payload = { 
        session_id: sessionId, 
        step: stepToSend, 
        answer: answer 
      };

      // Si no es la primera llamada ni "Back", guardamos el estado en el historial
      if (nextStepAction === 'next' && currentStepName !== 'start') {
          history.push(currentStepName); // Solo guardamos el nombre del paso completado
      }
      
      const data = await apiRequest("/next-step", payload);

      // El backend devuelve el nombre del *próximo* paso
      if (data.step === "menu_final") {
        showMenu(data);
      } else {
        currentStepName = data.step; // Actualiza el paso actual al que el backend nos envió
        showForm(data.question, data.fields);
      }
    }

    function handleFormSubmit(e, fields) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const answer = {};

      fields.forEach(f => {
        const values = formData.getAll(f.name);
        if (f.type === 'multiselect') {
          // Los multiselects se guardan siempre como un array
          answer[f.name] = values; 
        } else {
          // El resto se guarda como el primer valor
          answer[f.name] = values[0];
        }
      });
      
      fetchStep(answer, 'next');
    }
    
    function handleBack() {
      if (history.length > 0) {
        // Sacamos el último paso completado del historial.
        history.pop(); 
        // El backend maneja la lógica de qué paso mostrar.
        fetchStep({}, 'back'); 
      }
    }


    // --- Funciones de Renderizado ---
    
    function showForm(question, fields) {
      let formHtml = `<form id="stepForm" class="p-6">
        <h2 class="text-xl font-semibold mb-6 text-gray-800">${question}</h2>`;
      
      fields.forEach(f => {
        const inputId = `input-${f.name.replace(/\s/g, '-')}`;
        formHtml += `<div class="mb-4">
          <label for="${inputId}" class="block text-sm font-medium text-gray-700 mb-1">
            ${f.name} ${f.unit ? `(${f.unit})` : ''}
          </label>`;

        if (f.type === "select" || f.type === "multiselect") {
          const isMultiple = f.type === "multiselect" ? 'multiple' : '';
          const sizeAttr = f.type === "multiselect" ? 'size="5"' : '';
          
          formHtml += `<select id="${inputId}" name="${f.name}" ${isMultiple} ${sizeAttr} 
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm rounded-md shadow-sm">
            ${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}
          </select>`;
        } else {
          formHtml += `<input type="${f.type}" id="${inputId}" name="${f.name}" required 
            class="shadow-sm focus:ring-orange-500 focus:border-orange-500 block w-full sm:text-sm border-gray-300 rounded-md p-2" />`;
        }
        formHtml += `</div>`;
      });

      formHtml += `<div class="flex justify-between mt-8">`;
      if (history.length > 0) {
        formHtml += `<button type="button" id="backBtn" class="bg-gray-400 hover:bg-gray-500 text-white font-medium py-2 px-4 rounded-lg transition duration-150">
          ← Back
        </button>`;
      } else {
        formHtml += '<div></div>'; // Espaciador para mantener el botón "Next" a la derecha
      }
      formHtml += `<button type="submit" class="font-medium py-2 px-4 rounded-lg transition duration-150" 
        style="background-color: #ff7b00; color: white; hover:bg-orange-600;">
        Next →
      </button>`;
      formHtml += `</div></form>`;

      const appDiv = document.getElementById("app");
      appDiv.innerHTML = formHtml;

      document.getElementById("stepForm").onsubmit = (e) => handleFormSubmit(e, fields);
      const backBtn = document.getElementById("backBtn");
      if (backBtn) {
        backBtn.onclick = handleBack;
      }
    }

    async function showMenu(data) {
      let menuHtml = `
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Your Menu is Ready!</h2>
        <p class="text-lg font-medium mb-6 text-gray-600">Total Price: <span class="text-2xl font-extrabold text-green-600">$${data.price.toFixed(2)}</span></p>
        
        <div id="menu" class="space-y-4 max-h-96 overflow-y-auto pr-2">
      `;
      
      data.menu.forEach(m => {
        menuHtml += `
          <div class="meal bg-gray-50 p-4 rounded-lg shadow-sm border border-gray-200 flex justify-between items-center">
            <div>
              <strong class="text-base text-gray-900">${m.name}</strong> 
              <span class="text-sm text-gray-500"> (Day ${m.day} - ${m.type})</span><br>
              <span class="text-sm text-gray-700">${m.calories} kcal - $${m.price.toFixed(2)}</span>
            </div>
            <button onclick="handleSwapMeal('${m.name}')" 
                    class="ml-4 bg-yellow-500 text-white text-xs font-semibold py-1 px-3 rounded-full hover:bg-yellow-600 transition duration-150">
              Swap
            </button>
          </div>
        `;
      });
      
      menuHtml += `</div>
        <div class="mt-6 flex justify-center space-x-4">
          <button onclick="handleRedoMenu()" class="bg-blue-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-150">
            Regenerate Menu
          </button>
          <!-- Se puede agregar un modal para la proteína aquí -->
        </div>
      `;
      document.getElementById("app").innerHTML = menuHtml;
    }
    
    // --- Funciones de Interacción del Menú ---

    async function handleSwapMeal(mealName) {
      // Usar un modal en lugar de confirm(), pero para la prueba rápida:
      if (!confirm(`Are you sure you want to swap ${mealName}?`)) return;
      
      const payload = { 
        session_id: sessionId, 
        meal_name: mealName 
      };
      
      const data = await apiRequest("/swap-meal", payload);
      if (data) {
        showMenu(data);
      }
    }

    async function handleRedoMenu() {
      // Usar un modal en lugar de confirm(), pero para la prueba rápida:
      if (!confirm("Are you sure you want to regenerate the entire menu?")) return;
      
      const payload = { 
        session_id: sessionId 
      };
      
      const data = await apiRequest("/redo-menu", payload);
      if (data) {
        showMenu(data);
      }
    }

    // Iniciar la aplicación
    // La primera llamada usa currentStepName = 'start'
    fetchStep({}, 'next'); 
  </script>
</body>
</html>
